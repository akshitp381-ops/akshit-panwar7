<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blue Tigers FC</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #0b3d91, #1e90ff);
            text-align: center;
        }

        .box {
            background-color: white;
            width: 75%;
            max-width: 600px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #0b3d91;
            margin-bottom: 5px;
        }

        .tagline {
            color: #777;
            font-weight: bold;
            margin-bottom: 15px;
        }

        img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #0b3d91;
            margin: 15px 0;
        }

        h2 {
            color: #333;
            margin-top: 20px;
        }

        p {
            color: #555;
            font-size: 15px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background-color: #f2f2f2;
            margin: 8px;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #0b3d91;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1e90ff;
        }

        footer {
            margin-top: 20px;
            color: #888;
            font-size: 13px;
        }
    </style>

</head>
<body>

    <div class="box">
        <h1>⚽ Real Madrid FC</h1>
        <p class="tagline">Passion • Pride • Victory</p>

        <!-- Club Image -->
        <img src="https://tse2.mm.bing.net/th/id/OIP.CXT6V1CfzxJdKIrRpNp9CAHaEK?cb=ucfimg2&ucfimg=1&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Blue Tigers FC">

        <h2>About the Club</h2>
        <p>
            Blue Tigers FC is a football club founded in 2020.
            We believe in teamwork, discipline, and winning with respect.
        </p>

        <h2>Achievements</h2>
        <ul>
            <li>🏆 City League Champions</li>
            <li>🥇 State Cup Winners</li>
            <li>⭐ Best Youth Team</li>
        </ul>

        <button>Join the Club</button>

        <footer>
            © 2025 Blue Tigers FC
        </footer>
    </div>

</body>
</html>
