<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar</title>

    <style>
        
        .heading {
            background-color: lightblue;
            text-align: center;
            padding: 15px;
            border: 1px solid black;
            width: 95%;
            margin: auto;
        }

        
        .highlight {
            color: green;
        }

        
        .nav-box {
            border: 1px solid black;
            width: 95%;
            margin: auto;
            padding: 20px;
        }

        
        .menu a {
            text-decoration: none;
            padding: 8px 12px;
            margin: 5px;
            display: inline-block;
            font-size: 16px;
            border-radius: 3px;
        }

        .top-menu a {
            background-color: rgb(196, 89, 194);
        }

        .bottom-menu a {
            background-color: rgb(41, 225, 225);
        }
    </style>
</head>

<body>

    <div class="heading">
        My Website Navigation
    </div>

    <div class="nav-box">

        
        <div class="menu top-menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>

        
        <div class="menu bottom-menu">
            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Messages</a>
            <a href="#">Logout</a>
        </div>
        
    </div>

</body>
</html>
