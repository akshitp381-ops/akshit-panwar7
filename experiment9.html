<!DOCTYPE html>
<html>
<head>
    <title>Responsive Product Grid</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 15px;
            padding: 20px;
        }

        .item {
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
        }

        .item img {
            width: 100%;
            border-radius: 5px;
        }

        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        
        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Product Grid</h1>

    <div class="grid">

        <div class="item">
            <img src="https://th.bing.com/th/id/OIP.3UzzOOli9v5gGn4YDpaFAQHaHa?w=176&h=180&c=7&r=0&o=7&cb=ucfimg2&dpr=1.3&pid=1.7&rm=3&ucfimg=1" >
            <p><b>PRODUCT 1</b></p>
        </div>

        <div class="item">
            <img src="https://th.bing.com/th/id/OIP.E2S3G6EfRfrUZlAPGfG7QwHaHa?w=169&h=180&c=7&r=0&o=7&cb=ucfimg2&dpr=1.3&pid=1.7&rm=3&ucfimg=1">
            <p><b>PRODUCT 2</b></p>
        </div>

        <div class="item">
            <img src="https://th.bing.com/th/id/OIP.3g6E0D1CFKh_k-FEZHesCAHaE5?w=280&h=185&c=7&r=0&o=7&cb=ucfimg2&dpr=1.3&pid=1.7&rm=3&ucfimg=1">
            <p><b>PRODUCT 3</b></p>
        </div>

        <div class="item">
            <img src="https://th.bing.com/th/id/OIP.iSSdQcBsp6Hk69qIsJ0nUgHaD-?w=292&h=180&c=7&r=0&o=7&cb=ucfimg2&dpr=1.3&pid=1.7&rm=3&ucfimg=1">
            <p><b>PRODUCT 4</b></p>
        </div>

    </div>

</body>
</html>
